<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>{{if .OK}}Operational{{else}}Problem detected{{end}} · Dental Server</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #9aa1ad; --border: #262a33;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1717;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 440px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  header { padding: 28px 24px 22px; text-align: center; }
  .badge {
    width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; font-size: 24px; font-weight: 700;
  }
  .ok .badge { background: var(--ok-bg); color: var(--ok); }
  .bad .badge { background: var(--bad-bg); color: var(--bad); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  li { display: flex; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: 0; }
  .dot { flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; }
  .dot.up { background: var(--ok); }
  .dot.down { background: var(--bad); }
  .name { font-weight: 600; }
  .detail { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .down + div .detail { color: var(--bad); }
  footer { margin-top: 14px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="card {{if .OK}}ok{{else}}bad{{end}}">
    <header>
      <div class="badge" aria-hidden="true">{{if .OK}}&#10003;{{else}}!{{end}}</div>
      <h1>{{if .OK}}All systems operational{{else}}Something is wrong{{end}}</h1>
      <p>Dental Server</p>
    </header>
    <ul>
      {{range .Checks}}
      <li>
        <span class="dot {{if .OK}}up{{else}}down{{end}}"></span>
        <div>
          <div class="name">{{.Name}}</div>
          <div class="detail">{{.Detail}}</div>
        </div>
      </li>
      {{end}}
    </ul>
  </div>
  <footer>Version {{.Version}} · up {{.Uptime}} · {{.Time}}<br>Refreshes every 10 seconds</footer>
</main>
</body>
</html>
