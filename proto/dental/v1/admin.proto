syntax = "proto3";

package dental.v1;

import "buf/validate/validate.proto";
import "dental/v1/auth.proto";
import "dental/v1/patient.proto";
import "dental/v1/person.proto";
import "dental/v1/subscription.proto";
import "google/protobuf/timestamp.proto";

// The admin panel: system administrators, subscription plans, selling
// subscriptions and looking up patients. Administrators are separate from user accounts, with their own
// logins and sessions; a user session never works here and an admin session
// never works anywhere else.
//
// Every call except Login needs an admin session, proven by both of:
//
//   - the cookie `dental_admin_token` that Login sets: a JSON Web Token (HS256)
//     naming the session. It is HttpOnly (scripts in the page can never read it),
//     Secure, SameSite=Strict and sent only to AdminService paths. Browsers send
//     it by themselves; other clients send it back as received.
//   - the header `X-CSRF-Token: <csrf_token from Login>`. Another site can make a
//     browser send the cookie but cannot know this token, so it cannot act as the
//     administrator (cross-site request forgery).
//
// The session behind the token is checked on every call, so Logout, its expiry
// or disabling the administrator end it at once. Without a valid session and
// CSRF token, calls fail with UNAUTHENTICATED "unauthenticated".
//
// The first administrator is created on the server with `dental-server create-admin`.
service AdminService {
  // Fails with UNAUTHENTICATED "invalid_credentials" or PERMISSION_DENIED "user_disabled".
  rpc Login(AdminServiceLoginRequest) returns (AdminServiceLoginResponse) {}

  // Ends the session at once and removes its cookie.
  rpc Logout(AdminServiceLogoutRequest) returns (AdminServiceLogoutResponse) {}

  // Fails with "invalid_argument" / "weak_password" or ALREADY_EXISTS "username_taken".
  rpc CreateAdmin(CreateAdminRequest) returns (CreateAdminResponse) {}

  // All plans, the ones still on sale first.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {}

  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse) {}

  // Changes a plan. Subscriptions already sold keep the limits and price they
  // were sold with. Fails with NOT_FOUND "plan_not_found".
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse) {}

  // An account by identification code, with the clinics it owns and its subscriptions.
  // Fails with NOT_FOUND "user_not_found".
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {}

  // Sells a subscription from a plan. It starts when the user's paid time ends
  // (now, if they have none left), so buying early adds to the time left.
  //
  // Fails with NOT_FOUND "user_not_found" / "plan_not_found" or
  // FAILED_PRECONDITION "plan_inactive".
  rpc SellSubscription(SellSubscriptionRequest) returns (SellSubscriptionResponse) {}

  // Cancels a subscription at once; its clinics lose access if no other
  // subscription is in force. Canceling twice changes nothing.
  // Fails with NOT_FOUND "subscription_not_found".
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {}

  // Subscriptions of every user, a page at a time: newest first (starts_at, then id,
  // both descending), with their owner and the payment that bought them.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {}

  // Payments reported by clinic owners (BillingService.CreatePayment), with who paid,
  // a page at a time. Asking for pending ones lists them oldest first (the queue to
  // review); otherwise newest first. Ties are ordered by id, so pages are stable.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse) {}

  // Approves a pending payment after checking the bank statement, and adds the
  // subscription it pays for, as the payment says (PurchaseMode):
  // - PURCHASE_MODE_EXTEND: like SellSubscription, from when the paid time ends;
  // - PURCHASE_MODE_UPGRADE_NOW: from now; the subscription in force ends now.
  // The limits, duration and price are the ones fixed when the payment was reported.
  //
  // Fails with NOT_FOUND "payment_not_found", FAILED_PRECONDITION "payment_not_pending"
  // or, for an upgrade, FAILED_PRECONDITION "renewal_queued": a subscription was sold
  // after the payment that starts after the one in force (reject the payment instead).
  rpc ApprovePayment(ApprovePaymentRequest) returns (ApprovePaymentResponse) {}

  // Rejects a pending payment; the owner sees the reason.
  // Fails with NOT_FOUND "payment_not_found" or FAILED_PRECONDITION "payment_not_pending".
  rpc RejectPayment(RejectPaymentRequest) returns (RejectPaymentResponse) {}

  // Every payment account, the active ones first, in position order.
  rpc ListPaymentAccounts(ListPaymentAccountsRequest) returns (ListPaymentAccountsResponse) {}

  rpc CreatePaymentAccount(CreatePaymentAccountRequest) returns (CreatePaymentAccountResponse) {}

  // Changes an account. Payments already reported keep pointing to it.
  // Fails with NOT_FOUND "payment_account_not_found".
  rpc UpdatePaymentAccount(UpdatePaymentAccountRequest) returns (UpdatePaymentAccountResponse) {}

  // Patients synced from every clinic, a page at a time: newest first (created_at,
  // then id, both descending). Only who they are and how to reach them: never their
  // address, medical notes or treatments.
  rpc ListPatients(ListPatientsRequest) returns (ListPatientsResponse) {}
}

message Admin {
  // 16 raw UUID bytes.
  bytes id = 1;
  string username = 2;
  string full_name = 3;
}

// A clinic as the admin panel lists it.
message ClinicSummary {
  // 16 raw UUID bytes.
  bytes id = 1;
  string name = 2;
  string license_number = 3;
  string city = 4;
  // Installations that are not revoked.
  uint32 installation_count = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AdminServiceLoginRequest {
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string password = 2 [(buf.validate.field).string.max_bytes = 1024];
}

message AdminServiceLoginResponse {
  // Was the opaque session token, now the `dental_admin_token` cookie.
  reserved 1;
  reserved "session_token";
  google.protobuf.Timestamp session_expires_at = 2;
  Admin admin = 3;
  // Sent as the header `X-CSRF-Token` on every other call of this session.
  // Kept by the panel only for as long as the session (never in a cookie).
  string csrf_token = 4;
}

message AdminServiceLogoutRequest {}

message AdminServiceLogoutResponse {}

message CreateAdminRequest {
  // Same rules as SignUpRequest.username.
  string username = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._-]{3,32}$"];
  // Same rules as SignUpRequest.password.
  string password = 2 [
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).cel = {
      id: "weak_password"
      message: "must have at least 8 characters, a lowercase letter, an uppercase letter and a digit"
      expression: "size(this) >= 8 && this.matches('[a-z]') && this.matches('[A-Z]') && this.matches('[0-9]')"
    }
  ];
  // 1–100 characters.
  string full_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

message CreateAdminResponse {
  Admin admin = 1;
}

message ListPlansRequest {}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreatePlanRequest {
  // 1–100 characters.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // 1–1000.
  uint32 max_clinics = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // 1–1000.
  uint32 max_devices_per_clinic = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  // 1–3650.
  uint32 duration_days = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 3650
  }];
  // Not negative.
  int64 price_rials = 5 [(buf.validate.field).int64.gte = 0];
  // How many times each owner may buy it in the desktop app (BillingService), 0 for
  // no limit, at most 1000. SellSubscription is not limited.
  uint32 max_purchases_per_owner = 6 [(buf.validate.field).uint32.lte = 1000];
}

message CreatePlanResponse {
  Plan plan = 1;
}

message UpdatePlanRequest {
  // 16 raw UUID bytes.
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  // The other fields replace the plan's; same rules as CreatePlanRequest.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  uint32 max_clinics = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  uint32 max_devices_per_clinic = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
  uint32 duration_days = 5 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 3650
  }];
  int64 price_rials = 6 [(buf.validate.field).int64.gte = 0];
  bool active = 7;
  uint32 max_purchases_per_owner = 8 [(buf.validate.field).uint32.lte = 1000];
}

message UpdatePlanResponse {
  Plan plan = 1;
}

message GetUserRequest {
  PersonIdentity identity = 1 [(buf.validate.field).required = true];
}

message GetUserResponse {
  User user = 1;
  // Identification code.
  PersonIdentity identity = 2;
  string phone = 3;
  bool disabled = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated ClinicSummary owned_clinics = 6;
  // Newest first, canceled ones included.
  repeated Subscription subscriptions = 7;
  // Payments reported in the desktop app, newest first.
  repeated Payment payments = 8;
}

message SellSubscriptionRequest {
  // 16 raw UUID bytes: the clinic owner (from GetUser).
  bytes user_id = 1 [(buf.validate.field).bytes.len = 16];
  // 16 raw UUID bytes.
  bytes plan_id = 2 [(buf.validate.field).bytes.len = 16];
  // E.g. the payment reference. At most 500 characters.
  string note = 3 [(buf.validate.field).string.max_len = 500];
}

message SellSubscriptionResponse {
  Subscription subscription = 1;
}

message CancelSubscriptionRequest {
  // 16 raw UUID bytes.
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
}

message CancelSubscriptionResponse {
  Subscription subscription = 1;
}

// Where a subscription stands, on the server's clock.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  // Not canceled; starts_at <= now < ends_at.
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  // Not canceled; now < starts_at (a renewal queued after the paid time).
  SUBSCRIPTION_STATUS_UPCOMING = 2;
  // Not canceled; ends_at <= now. Includes one that an upgrade ended early.
  SUBSCRIPTION_STATUS_ENDED = 3;
  // canceled_at is set.
  SUBSCRIPTION_STATUS_CANCELED = 4;
}

message ListSubscriptionsRequest {
  // Only subscriptions in this status now; SUBSCRIPTION_STATUS_UNSPECIFIED for all.
  SubscriptionStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // Only owners whose full name, username, identification code or phone contains
  // this text, ignoring case and surrounding spaces; empty for all.
  string query = 2 [(buf.validate.field).string.max_len = 100];
  // Which page, from 1; 0 means 1.
  uint32 page = 3 [(buf.validate.field).uint32.lte = 100000];
  // Subscriptions per page, up to 100; 0 means 20.
  uint32 page_size = 4 [(buf.validate.field).uint32.lte = 100];
}

message ListSubscriptionsResponse {
  repeated SubscriptionListItem items = 1;
  // How many subscriptions match the filters, across all pages.
  uint32 total_count = 2;
}

message SubscriptionListItem {
  // With the administrator's note.
  Subscription subscription = 1;
  SubscriptionStatus status = 2;
  // The owner.
  User user = 3;
  // The owner's identification code, for GetUser; empty if none is on file.
  PersonIdentity identity = 4;
  string phone = 5;
  bool user_disabled = 6;
  // The approved payment that bought it (Payment.subscription_id); unset when it was
  // sold in the admin panel (SellSubscription).
  Payment purchase = 7;
}

message ListPaymentsRequest {
  // Only payments with this status; PAYMENT_STATUS_UNSPECIFIED for all.
  PaymentStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // Replaced by page and page_size.
  reserved 2;
  reserved "limit";
  // Only payments whose owner's full name, username, identification code or phone,
  // or whose transfer reference, contains this text, ignoring case and surrounding
  // spaces; empty for all.
  string query = 3 [(buf.validate.field).string.max_len = 100];
  // Which page, from 1; 0 means 1.
  uint32 page = 4 [(buf.validate.field).uint32.lte = 100000];
  // Payments per page, up to 100; 0 means 20.
  uint32 page_size = 5 [(buf.validate.field).uint32.lte = 100];
}

message ListPaymentsResponse {
  repeated PaymentReview payments = 1;
  // How many payments match the filters, across all pages.
  uint32 total_count = 2;
}

// A payment with what an administrator needs to check it.
message PaymentReview {
  Payment payment = 1;
  // The clinic owner who reported it.
  User user = 2;
  PersonIdentity identity = 3;
  string phone = 4;
  // Where the money was sent; unset for payments without a manual transfer.
  PaymentAccount account = 5;
}

message ApprovePaymentRequest {
  // 16 raw UUID bytes.
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  // Saved as the subscription's note. At most 500 characters.
  string note = 2 [(buf.validate.field).string.max_len = 500];
}

message ApprovePaymentResponse {
  Payment payment = 1;
  // The subscription added.
  Subscription subscription = 2;
}

message RejectPaymentRequest {
  // 16 raw UUID bytes.
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  // Shown to the owner. 1–500 characters.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

message RejectPaymentResponse {
  Payment payment = 1;
}

message ListPaymentAccountsRequest {}

message ListPaymentAccountsResponse {
  repeated PaymentAccount accounts = 1;
}

message CreatePaymentAccountRequest {
  option (buf.validate.message).cel = {
    id: "destination_required"
    message: "a card number or an IBAN is required"
    expression: "this.card_number != '' || this.iban != ''"
  };

  // 1–100 characters.
  string bank_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // 1–100 characters.
  string holder_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Empty, or 16 digits.
  string card_number = 3 [(buf.validate.field).string.pattern = "^([0-9]{16})?$"];
  // Empty, or "IR" and 24 digits.
  string iban = 4 [(buf.validate.field).string.pattern = "^(IR[0-9]{24})?$"];
  int32 position = 5;
}

message CreatePaymentAccountResponse {
  PaymentAccount account = 1;
}

message UpdatePaymentAccountRequest {
  option (buf.validate.message).cel = {
    id: "destination_required"
    message: "a card number or an IBAN is required"
    expression: "this.card_number != '' || this.iban != ''"
  };

  // 16 raw UUID bytes.
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  // The other fields replace the account's; same rules as CreatePaymentAccountRequest.
  string bank_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string holder_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string card_number = 4 [(buf.validate.field).string.pattern = "^([0-9]{16})?$"];
  string iban = 5 [(buf.validate.field).string.pattern = "^(IR[0-9]{24})?$"];
  int32 position = 6;
  bool active = 7;
}

message UpdatePaymentAccountResponse {
  PaymentAccount account = 1;
}

message ListPatientsRequest {
  // Only patients whose name ("first last"), identification code or phone contains
  // this text, ignoring case and surrounding spaces; empty for all.
  string query = 1 [(buf.validate.field).string.max_len = 100];
  // Which page, from 1; 0 means 1.
  uint32 page = 2 [(buf.validate.field).uint32.lte = 100000];
  // Patients per page, up to 100; 0 means 20.
  uint32 page_size = 3 [(buf.validate.field).uint32.lte = 100];
}

message ListPatientsResponse {
  repeated PatientListItem patients = 1;
  // How many patients match the search, across all pages.
  uint32 total_count = 2;
}

// A patient as the admin panel lists it; fields as in Patient.
message PatientListItem {
  // 16 bytes (Patient.id).
  bytes id = 1;
  PersonIdentity identity = 2;
  string first_name = 3;
  string last_name = 4;
  string birth_date = 5;
  Gender gender = 6;
  string phone = 7;
  // Clinics the record is synced to: every clinic that sent it or treats the patient.
  uint32 clinic_count = 8;
  // Treatments in every clinic, deleted ones left out.
  uint32 treatment_count = 9;
  // When the server first received the patient.
  google.protobuf.Timestamp created_at = 10;
  // When the details were last changed (Patient.updated_at).
  google.protobuf.Timestamp updated_at = 11;
}
