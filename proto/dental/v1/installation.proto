syntax = "proto3";

package dental.v1;

import "buf/validate/validate.proto";
import "dental/v1/auth.proto";
import "dental/v1/person.proto";
import "google/protobuf/timestamp.proto";

// An installation is one copy of the desktop app on one computer, with its own
// local database. It belongs to one clinic; a clinic can have several, up to the
// limit of its owner's subscription. A doctor working in three clinics has three
// installations.
service InstallationService {
  // Called once, the first time the app starts. No login needed.
  //
  // Either registers a new clinic together with its owner (the person responsible
  // for the clinic: a new account created here, or an existing one proven with its
  // password), or adds the installation to an existing clinic, which only that
  // clinic's owner can do. The owner is a member and admin of the clinic.
  //
  // Registering needs no subscription, but nobody can log in until the owner has
  // one (see AuthService.Login).
  //
  // Besides the usual "invalid_argument" / "weak_password", fails with:
  // - ALREADY_EXISTS "license_number_taken": another clinic has this license number;
  // - ALREADY_EXISTS "username_taken" / "identity_taken": a new owner's username
  //   or identity (national ID or FIDA code) belongs to another account;
  // - INVALID_ARGUMENT "invalid_national_id": the national ID's check digit is wrong;
  // - UNAUTHENTICATED "invalid_credentials": an existing owner's username or password is wrong;
  // - PERMISSION_DENIED "user_disabled": an existing owner's account is disabled;
  // - FAILED_PRECONDITION "identity_mismatch": an existing owner has another identity on file;
  // - INVALID_ARGUMENT "invalid_argument": existing_clinic with a new_owner;
  // - NOT_FOUND "clinic_not_found": no clinic has existing_clinic.license_number;
  // - PERMISSION_DENIED "not_clinic_owner": the clinic belongs to someone else.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

// Describes the computer, so the server knows where an installation runs.
message MachineInfo {
  // SHA-256 of the Windows MachineGuid (32 bytes). Stays the same when the app
  // is reinstalled, changes when Windows is reinstalled.
  bytes machine_id_hash = 1 [(buf.validate.field).bytes.len = 32];
  // At most 255 characters.
  string hostname = 2 [(buf.validate.field).string.max_len = 255];
  // e.g. "Windows 11 Enterprise". At most 100 characters.
  string os_name = 3 [(buf.validate.field).string.max_len = 100];
  // e.g. "10.0.26200". At most 50 characters.
  string os_version = 4 [(buf.validate.field).string.max_len = 50];
  // At most 200 characters.
  string cpu_model = 5 [(buf.validate.field).string.max_len = 200];
  uint32 cpu_cores = 6;
  uint64 memory_bytes = 7;
  // MAC addresses of the physical network adapters, e.g. "AA:BB:CC:DD:EE:FF".
  // At most 32 addresses of at most 64 characters each.
  repeated string mac_addresses = 8 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 64}
    }
  }];
  // Desktop app version, e.g. "0.1.0". At most 50 characters.
  string app_version = 9 [(buf.validate.field).string.max_len = 50];
}

// A new clinic. Text is sent trimmed.
message ClinicInfo {
  // 1–200 characters.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The clinic's operating license number. Unique across all clinics, not
  // case-sensitive. 3–32 characters: letters, digits, '.', '/' or '-'.
  string license_number = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9./-]{3,32}$"];
  // 7–15 digits, optionally starting with '+'.
  string phone = 3 [(buf.validate.field).string.pattern = "^\\+?[0-9]{7,15}$"];
  // 1–100 characters.
  string city = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // 1–500 characters.
  string address = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // Optional: empty, or 5–10 digits.
  string postal_code = 6 [(buf.validate.field).string.pattern = "^([0-9]{5,10})?$"];
}

// A clinic owner who has no account yet: the account is created by Register.
message NewOwner {
  // Same rules as SignUpRequest.username.
  string username = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._-]{3,32}$"];
  // Same rules as SignUpRequest.password.
  string password = 2 [
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).cel = {
      id: "weak_password"
      message: "must have at least 8 characters, a lowercase letter, an uppercase letter and a digit"
      expression: "size(this) >= 8 && this.matches('[a-z]') && this.matches('[A-Z]') && this.matches('[0-9]')"
    }
  ];
  // 1–100 characters.
  string full_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  reserved 4;
  reserved "national_id";
  // Mobile number: 7–15 digits, optionally starting with '+'.
  string phone = 5 [(buf.validate.field).string.pattern = "^\\+?[0-9]{7,15}$"];
  // National ID or FIDA code, and nationality. Unique across all accounts.
  PersonIdentity identity = 6 [(buf.validate.field).required = true];
}

// A clinic owner who already has an account (AuthService.SignUp, MemberService.CreateUser,
// or the owner of another clinic).
message ExistingOwner {
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string password = 2 [(buf.validate.field).string.max_bytes = 1024];
  reserved 3;
  reserved "national_id";
  // Must match the identity on file (type and number). Saved if the account has
  // none yet (accounts made before identities were required).
  PersonIdentity identity = 4 [(buf.validate.field).required = true];
}

// A clinic registered earlier, to add another installation to it.
message ExistingClinic {
  // Not case-sensitive.
  string license_number = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9./-]{3,32}$"];
}

message RegisterRequest {
  MachineInfo machine = 1 [(buf.validate.field).required = true];
  oneof target {
    option (buf.validate.oneof).required = true;
    // Registers a new clinic.
    ClinicInfo clinic = 2;
    // Adds the installation to an existing clinic. Needs existing_owner: the clinic's owner.
    ExistingClinic existing_clinic = 6;
  }
  oneof owner {
    option (buf.validate.oneof).required = true;
    NewOwner new_owner = 3;
    ExistingOwner existing_owner = 4;
  }
}

message RegisterResponse {
  // 16 raw UUID bytes. The client stores it; it marks the app as already set up.
  bytes installation_id = 1;
  // 32 random bytes. The client stores it encrypted with DPAPI and sends it with
  // every login: keys are only given to logins coming from this installation.
  bytes installation_secret = 2;
  // True if an earlier installation was registered from the same computer.
  bool known_machine = 3;
  google.protobuf.Timestamp server_time = 4;
  // The clinic's owner, a member and admin of the clinic.
  User owner = 5;
  // 16 raw UUID bytes.
  bytes clinic_id = 6;
}
