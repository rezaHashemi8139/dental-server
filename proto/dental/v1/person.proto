syntax = "proto3";

package dental.v1;

import "buf/validate/validate.proto";

// Who a person (a user or a patient) is: one identification code, e.g. a national
// ID or any other official code. People are unique across the whole system by it.
// Nationality is not recorded.
message PersonIdentity {
  reserved 1, 3;
  reserved "type", "nationality";

  // 5–20 uppercase English letters or digits.
  string number = 2 [(buf.validate.field).string.pattern = "^[A-Z0-9]{5,20}$"];
}
