syntax = "proto3";

package dental.v1;

import "buf/validate/validate.proto";
import "dental/v1/crypto.proto";
import "google/protobuf/timestamp.proto";

// Accounts, logins and local-database keys.
//
// Calls marked "needs session" must send the session token from Login as
// the header `Authorization: Bearer <token>`.
service AuthService {
  // Creates an account. Does not log in.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {}

  // Logs in on an installation and returns the local-database keys.
  // The first user to log in on a new installation becomes its owner and admin.
  // Anyone else must have been added with MemberService.AddMember first.
  rpc Login(LoginRequest) returns (LoginResponse) {}

  // Confirms that the local database now uses the next key. Needs session.
  rpc ConfirmKeyRotation(ConfirmKeyRotationRequest) returns (ConfirmKeyRotationResponse) {}

  // Ends the session. Needs session.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
}

message User {
  // 16 raw UUID bytes.
  bytes id = 1;
  string username = 2;
  string full_name = 3;
}

message SignUpRequest {
  // 3–32 characters: letters, digits, '.', '_' or '-'. Not case-sensitive.
  string username = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._-]{3,32}$"];
  // At least 8 characters (at most 256), with at least one lowercase letter (a-z),
  // one uppercase letter (A-Z) and one digit (0-9). Otherwise SignUp fails with
  // INVALID_ARGUMENT and the message "weak_password".
  string password = 2 [
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).cel = {
      id: "weak_password"
      message: "must have at least 8 characters, a lowercase letter, an uppercase letter and a digit"
      expression: "size(this) >= 8 && this.matches('[a-z]') && this.matches('[A-Z]') && this.matches('[0-9]')"
    }
  ];
  // At most 100 characters.
  string full_name = 3 [(buf.validate.field).string.max_len = 100];
}

message SignUpResponse {
  User user = 1;
}

message LoginRequest {
  // 16 raw UUID bytes, from InstallationService.Register.
  bytes installation_id = 1 [(buf.validate.field).bytes.len = 16];
  // 32 bytes, from InstallationService.Register.
  bytes installation_secret = 2 [(buf.validate.field).bytes.len = 32];
  string username = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string password = 4 [(buf.validate.field).string.max_bytes = 1024];
  // A new X25519 public key (32 bytes) made for this login only.
  // The database keys are sealed to it (see SealedBox).
  bytes client_public_key = 5 [(buf.validate.field).bytes.len = 32];
}

message LoginResponse {
  // Session token for calls that need a session. Kept in memory only.
  string session_token = 1;
  google.protobuf.Timestamp session_expires_at = 2;
  User user = 3;
  bool is_owner = 4;
  bool is_admin = 5;
  // A sealed DatabaseKeys.
  SealedBox database_keys = 6;
  // Lets this user log in on this installation without the server until it expires.
  SignedOfflineGrant offline_grant = 7;
  google.protobuf.Timestamp server_time = 8;
}

message ConfirmKeyRotationRequest {
  // The version the database now uses: DatabaseKeys.current_version + 1.
  uint32 new_version = 1;
}

message ConfirmKeyRotationResponse {
  uint32 current_version = 1;
}

message LogoutRequest {}

message LogoutResponse {}
