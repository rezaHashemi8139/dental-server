# Generates Go code from proto/ into gen/. Run: go generate ./...
# Plugins are pinned as tools in go.mod, so nothing has to be installed globally.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: dental-server/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    # simple: handlers take and return plain messages (no connect.Request wrapper).
    opt:
      - paths=source_relative
      - simple
clean: true
